[project]
name = "scoutly"
version = "1.1.0"
description = "Multi-agent B2B account-intelligence and sourcing-strategy assistant (Intake / Company Research / Competitor / Recommendation / Report) — CAP 931 capstone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0",
    "beautifulsoup4>=4.13.0",
    "fpdf2>=2.8.8",
    "langchain-groq>=1.1.3",
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core checks. I: import sorting. UP: modernize
# syntax for the target Python version. B: common bug patterns (flake8-bugbear).
select = ["E", "F", "I", "UP", "B"]

